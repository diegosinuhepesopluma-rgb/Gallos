name: Build NeoForge Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Encontrar proyecto
        run: |
          PROJECT_DIR=$(find . -type f -name "build.gradle" -not -path "*/build/*" -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró build.gradle"
            exit 1
          fi
          echo "Proyecto: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar NeoForge
        run: |
          cd "$PROJECT_DIR"
          gradle clean build --no-daemon --stacktrace

      - name: Buscar JAR
        run: |
          find "$PROJECT_DIR/build/libs" -type f -name "*.jar"

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.
