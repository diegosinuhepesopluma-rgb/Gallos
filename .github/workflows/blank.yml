name: Build GalloGiro NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Buscar ZIP del proyecto
        shell: bash
        run: |
          set -e

          echo "Buscando ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"

          mkdir -p proyecto

          unzip -o "$ZIP_FILE" -d proyecto

          echo "Contenido:"
          find proyecto -maxdepth 4 -type f | head -100

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find proyecto -type f \
            -name "build.gradle" -o -name "build.gradle.kts" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró build.gradle."
            echo "Archivos encontrados:"
            find proyecto -type f | head -200
            exit 1
          fi

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR
