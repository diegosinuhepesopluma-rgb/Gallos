name: Generar JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"

      - name: Preparar proyecto GalloGiro
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "PREPARANDO GALLOGIRO"
          echo "=============================="

          BUILD_FILE=$(find . -type f -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)

          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
          else
            ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No se encontró el proyecto ni un ZIP."
              exit 1
            fi

            echo "ZIP: $ZIP_FILE"

            rm -rf proyecto
            mkdir proyecto

            unzip -q "$ZIP_FILE" -d proyecto

            BUILD_FILE=$(find proyecto -type f -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)

            if [ -z "$BUILD_FILE" ]; then
              echo "ERROR: El ZIP no contiene build.gradle."
              find proyecto -maxdepth 5 -type f
              exit 1
            fi

