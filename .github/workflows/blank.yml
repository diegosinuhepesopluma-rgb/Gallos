name: Construir GalloGiro NeoForge 1.21.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP"
            exit 1
          fi

          echo "ZIP: $ZIP"
          mkdir -p proyecto
          unzip -o "$ZIP" -d proyecto

      - name: Encontrar proyecto
        run: |
          PROJECT=$(find proyecto -type f \
            -name "build.gradle" -o -name "build.gradle.kts" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró build.gradle"
            find proyecto -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Proyecto encontrado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Compilar GalloGiro
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean build --no-daemon

      - name: Buscar JAR
        run: |
          JAR=$(find "$PROJECT_DIR/build/libs" \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No se encontró el JAR"
            find "$PROJECT_DIR/build" -type f
            exit 1
          fi

          echo "JAR encontrado: $JAR"
          cp "$JAR" GalloGiro-NeoForge-1.21.1.jar

      - name: Subir JAR
        uses: actions/upload
