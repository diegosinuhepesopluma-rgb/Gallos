name: Compilar JAR

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No se encontró ningún ZIP"
            exit 1
          fi

          rm -rf proyecto
          mkdir proyecto
          unzip -q "$ZIP" -d proyecto

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -e

          DIR=$(find "$GITHUB_WORKSPACE/proyecto" -type f -name "build.gradle*" -printf '%h\n' | head -n 1)

          if [ -z "$DIR" ]; then
            echo "No se encontró build.gradle"
            find proyecto -maxdepth 5 -type f
            exit 1
          fi

          echo "Proyecto encontrado en: $DIR"
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e
          cd "$DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "No existe gradlew; usando Gradle instalado"
            gradle --version
          fi

      - name: Compilar JAR
        shell: bash
        run: |
          set -e
          cd "$DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew clean build --no-daemon
          else
            gradle clean build --no-daemon
          fi

      - name: Entregar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: |
            ${{ env.DIR }}/build/libs/*.jar
          if-no-files-found: error
