name: GalloGiro 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "DESCOMPRIMIENDO GALLOGIRO"
          echo "=============================="

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP"
            exit 1
          fi

          mkdir -p proyecto_gallogiro
          unzip -o "$ZIP" -d proyecto_gallogiro

          echo "Proyecto descomprimido."

