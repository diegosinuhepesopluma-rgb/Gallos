name: Generar JAR GalloGiro NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Obtener código fuente completo
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 21 (versión actualizada)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # ❌ ELIMINAMOS el paso problemático de "gradle/actions/setup-gradle" que exige archivos que no tienes
      - name: 📦 Instalar Gradle manualmente
        run: |
          set -e
          apt update && apt install -y wget unzip
          wget https://services.gradle.org/distributions/gradle-8.14-bin.zip -P /tmp
          unzip -q /tmp/gradle-8.14-bin.zip -d /opt
          echo "/opt/gradle-8.14/bin" >> $GITHUB_PATH

      - name: 🔨 Verificar archivos del proyecto
        run: |
          ls -la
          echo "--- ¿Existe build.gradle? ---"
          test -f build.gradle && echo "✅ Sí" || echo "❌ NO EXISTE - debes crearlo"

      - name: 🔓 Dar permisos si existe gradlew
        run: chmod +x gradlew 2>/dev/null || true

      - name: 🔎 Compilar proyecto
        run: |
          gradle build --no-daemon --stacktrace

      - name: 📂 Recopilar JAR
        run: |
          mkdir -p resultado
          JAR=$(find ./build/libs -name "*.jar" ! -name "*sources*" ! -name "*dev*" | head -n 1)
          if [ -z "$JAR" ]; then
            echo "❌ No se generó el JAR"
            exit 1
          fi
          cp "$JAR" resultado/

      - name: 📤 Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: resultado/*.jar
          if-no-files-found: error
