name: Generar JAR GalloGiro NeoForge 1.21.1

on:
  workflow_dispatch: # Ejecución manual
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Obtener código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # Acelera dependencias

      - name: 🧩 Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14' # Compatible con NeoForge 1.21.1

      # ELIMINADO: Búsqueda/descompresión ZIP → innecesario y causa rutas rotas
      # Trabajamos directamente en el directorio raíz del proyecto

      - name: 🔨 Compilar mod con Gradle
        run: |
          chmod +x gradlew # Permisos de ejecución
          ./gradlew build --no-daemon --stacktrace
        # --stacktrace te dirá exactamente dónde falla si pasa algo

      - name: 📂 Buscar y copiar JAR final
        id: extraer_jar
        run: |
          set -e
          mkdir -p artefacto

          # Busca JAR en la ubicación estándar de NeoForge: build/libs/
          JAR=$(find ./build/libs -maxdepth 2 -type f -name "*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "*-dev.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "❌ ERROR: No se encontró el archivo JAR compilado."
            ls -R build/ || true
            exit 1
          fi

          cp "$JAR" artefacto/
          echo "jar_path=$JAR" >> "$GITHUB_OUTPUT"
          echo "✅ Encontrado: $JAR"

      - name: 📤 Subir JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: artefacto/*.jar
          if-no-files-found: error
          retention-days: 30
