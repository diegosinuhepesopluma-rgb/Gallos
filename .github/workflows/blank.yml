name: GalloGiro 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "DESCOMPRIMIENDO GALLOGIRO"
          echo "========================================"

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP."
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          mkdir -p proyecto_gallogiro

          unzip -o "$ZIP" -d proyecto_gallogiro

          echo ""
          echo "ZIP descomprimido correctamente."

          echo ""
          echo "Buscando build.gradle..."

          BUILD_FILE=$(find proyecto_gallogiro -type f | grep -E '/build\.gradle(\.kts)?$' | head -n 1 || true)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: El ZIP no contiene build.gradle."
            echo ""
            find proyecto_gallogiro -maxdepth 8 -type f | head -n 300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo ""
          echo "========================================"
          echo "PROYECTO ENCONTRADO"
          echo "========================================"

          echo "BUILD:"
          echo "$BUILD_FILE"

          echo ""
          echo "CARPETA:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar proyecto NeoForge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VERIFICANDO PROYECTO"
          echo "========================================"

          pwd

          echo ""
          echo "Archivos:"
          ls -la

          echo ""
          echo "build.gradle:"
          ls -lh build.gradle 2>/dev/null || true

          echo ""
          echo "gradlew:"
          ls -lh gradlew 2>/dev/null || true

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper encontrado."
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "Gradle Wrapper no encontrado."
            echo "Instalando Gradle..."

            sudo apt-get update
            sudo apt-get install -y gradle

            gradle --version
          fi

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "COMPILANDO GALLOGIRO"
          echo "NEOFORGE 1.21.1"
          echo "========================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean build --no-daemon --stacktrace
          else
            gradle clean build --no-daemon --stacktrace
          fi

      - name: Mostrar JAR generado
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "JAR GENERADO"
          echo "========================================"

          if [ ! -d "$PROJECT_DIR/build/libs" ]; then
            echo "ERROR: No existe la carpeta build/libs."
            exit 1
          fi

          ls -lah "$PROJECT_DIR/build/libs/"

          echo ""
          echo "JAR:"
          find "$PROJECT_DIR/build/libs" -type f -name "*.jar"

      - name: Subir JAR a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: "${{ env.PROJECT_DIR }}/build/libs/*.jar"
          if-no-files-found: error
