name: Build NeoForge Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Encontrar proyecto
        shell: bash
        run: |
          set -e

          if [ -f "proyecto/gallo_ready/build.gradle" ]; then
            PROJECT_DIR="proyecto/gallo_ready"
          elif [ -f "gallo_ready/build.gradle" ]; then
            PROJECT_DIR="gallo_ready"
          elif [ -f "build.gradle" ]; then
            PROJECT_DIR="."
          else
            echo "ERROR: No se encontró build.gradle"
            echo ""
            echo "Buscando archivos Gradle:"
            find . -type f -name "build.gradle" -o -name "build.gradle.kts" -print
            exit 1
          fi

