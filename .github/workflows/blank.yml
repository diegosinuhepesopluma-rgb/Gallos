name: Generar JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Buscar ZIP
        run: |
          echo "Buscando ZIP..."
          find . -type f -name "*.zip"

      - name: Descomprimir ZIP
        run: |
          ZIP=$(find . -type f -name "*.zip" | head -n 1)
          echo "ZIP encontrado: $ZIP"
          mkdir -p proyecto
          unzip -o "$ZIP" -d proyecto

      - name: Buscar Gradle
        run: |
          echo "Buscando build.gradle..."
          find proyecto -type f -name "build.gradle" -print
          find proyecto -type f -name "build.gradle.kts" -print

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Compilar JAR
        run: |
          BUILD=$(find proyecto -type f -name "build.gradle" | head -n 1)

          if [ -z "$BUILD" ]; then
            BUILD=$(find proyecto -type f -name "build.gradle.kts" | head -n 1)
          fi

          if [ -z "$BUILD" ]; then
            echo "ERROR: No hay build.gradle en el ZIP"
            exit 1
          fi

          CARPETA=$(dirname "$BUILD")
          cd "$CARPETA"

          gradle build --no-daemon

      - name: Buscar JAR
        run: |
          mkdir -p resultado
          find proyecto -type f -path "*/build/libs/*.jar" -exec cp {} resultado/ \;
          ls -lh resultado

      - name: Entregar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: resultado/*.jar
          if-no-files-found: error
