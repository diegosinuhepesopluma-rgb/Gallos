name: Compilar JAR

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Encontrar proyecto NeoForge
        run: |
          echo "Buscando build.gradle..."
          find . -name "build.gradle" -o -name "build.gradle.kts"

      - name: Compilar JAR
        run: |
          gradle build --no-daemon

      - name: Buscar JAR
        run: |
          echo "JAR generados:"
          find . -type f -name "*.jar"

      - name: Entregar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-JAR
          path: "**/build/libs/*.jar"
          if-no-files-found: error
