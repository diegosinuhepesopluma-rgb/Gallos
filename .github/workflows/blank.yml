name: Compilar NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compilar NeoForge 1.21.1
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " BUSCANDO PROYECTO NEOFORGE"
          echo "======================================"

          BUILD_FILE=$(find . -type f -name "build.gradle" -not -path "./.git/*" | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No se encontró build.gradle"
            echo ""
            echo "Archivos encontrados:"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "build.gradle encontrado:"
          echo "$BUILD_FILE"

          echo "Proyecto:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar proyecto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " VERIFICANDO PROYECTO"
          echo "======================================"

          pwd
          echo ""

          ls -la

          if [ ! -f "build.gradle" ]; then
            echo "ERROR: No existe build.gradle"
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "ERROR: No existe gradlew"
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Proyecto NeoForge correcto."

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Mostrar versión de Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --version

      - name: Limpiar proyecto
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew clean --no-daemon

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "======================================"
          echo " COMPILANDO GALLOGIRO"
          echo " NEOFORGE 1.21.1"
          echo "======================================"

          ./gradlew build --no-daemon --stacktrace

      - name: Buscar JAR generado
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " BUSCANDO JAR GENERADO"
          echo "======================================"

          find build/libs -type f -name "*.jar" -print

          JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No se generó ningún JAR."
            exit 1
          fi

          echo ""
          echo "JAR ENCONTRADO:"
          echo "$JAR"

          echo "JAR_FILE=$JAR" >> "$GITHUB_ENV"

      - name: Comprobar JAR
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "======================================"
          echo " JAR FINAL"
          echo "======================================"

          ls -lh "$JAR_FILE"

      - name: Subir JAR a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
