      - name: Preparar Gradle
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper encontrado."
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "No hay Gradle Wrapper."
            echo "Descargando Gradle 8.10.2..."

            wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

            unzip -q gradle-8.10.2-bin.zip

            export PATH="$PWD/gradle-8.10.2/bin:$PATH"

            echo "GRADLE_HOME=$PWD/gradle-8.10.2" >> "$GITHUB_ENV"
            echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"

            gradle --version
          fi
