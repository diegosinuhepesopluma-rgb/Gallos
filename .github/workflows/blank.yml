name: GalloGiro 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUSCANDO PROYECTO NEOFORGE"
          echo "========================================"

          BUILD_FILE=$(find . \
            -type f \
            -name "build.gradle" -o -name "build.gradle.kts" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No se encontró build.gradle."
            echo ""
            echo "Archivos del repositorio:"
            find . -maxdepth 5 -type f \
              -not -path "./.git/*" \
              | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "BUILD: $BUILD_FILE"
          echo "PROYECTO: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar proyecto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "PROYECTO NEOFORGE ENCONTRADO"
          echo "========================================"

          pwd

          echo ""
          echo "Contenido:"
          ls -la

          echo ""
          echo "Build:"
          ls -l build.gradle* 2>/dev/null || true

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Usando Gradle Wrapper"
            ./gradlew --version
          else
            echo "No existe gradlew."
            echo "Instalando Gradle..."

            sudo apt-get update
            sudo apt-get install -y gradle

            gradle --version
          fi

