name: Compilar GalloGiro

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Buscar build.gradle
        shell: bash
        run: |
          echo "Buscando build.gradle..."

          BUILD_FILE=$(find . -type f -name "build.gradle" | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No se encontró build.gradle"
            find . -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar NeoForge
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Compilando NeoForge..."

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean build --no-daemon
          else
            gradle clean build --no-daemon
          fi

      - name: Buscar JAR
        shell: bash
        run: |
          echo "Buscando JAR..."

          find "$PROJECT_DIR/build/libs" -type f -name "*.jar"

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
