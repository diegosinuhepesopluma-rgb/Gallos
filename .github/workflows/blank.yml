name: GalloGiro 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DESCOMPRIMIENDO GALLOGIRO"
          echo "======================================"

          ZIP_FILE="GalloGiro_GITHUB_COMPLETO.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró:"
            echo "$ZIP_FILE"
            echo ""
            echo "Archivos del repositorio:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          rm -rf proyecto_gallogiro
          mkdir -p proyecto_gallogiro

          unzip -o "$ZIP_FILE" -d proyecto_gallogiro

          echo ""
          echo "Buscando build.gradle..."

          BUILD_FILE=$(find proyecto_gallogiro \
            -type f \
            -name "build.gradle" \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE=$(find proyecto_gallogiro \
              -type f \
              -name "build.gradle.kts" \
              -print -quit)
