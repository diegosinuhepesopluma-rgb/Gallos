name: Compilar JAR

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Encontrar proyecto NeoForge
        id: proyecto
        shell: bash
        run: |
          PROJECT=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró build.gradle ni build.gradle.kts"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          DIR="${DIR#./}"

          echo "Proyecto encontrado en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar JAR
        shell: bash
        run: |
          cd "${{ steps.proyecto.outputs.dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Entregar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-JAR
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
