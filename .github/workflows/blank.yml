name: Generar JAR NeoForge 1.21.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Buscar ZIP del mod
        shell: bash
        run: |
          set -e

          echo "=== BUSCANDO ZIP ==="

          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          rm -rf proyecto
          mkdir proyecto

          unzip -q "$ZIP" -d proyecto

          echo "=== CONTENIDO ==="
          find proyecto -maxdepth 4 -type f | head -100

      - name: Encontrar carpeta del proyecto
        shell: bash
        run: |
          set -e

          PROJECT=$(find proyecto -type f -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró build.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper encontrado."
          else
            echo "ERROR: No existe gradlew en el proyecto."
            echo "El ZIP debe contener gradlew y gradle/wrapper."
            exit 1
          fi

      - name: Compilar JAR NeoForge 1.21.1
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== COMPILANDO GALLOGIRO ==="

          ./gradlew build --no-daemon

      - name: Buscar JAR generado
        shell: bash
        run: |
          set -e

          echo "=== JAR GENERADOS ==="

          find "$PROJECT_DIR/build/libs" -type f -name "*.jar" -print

          JAR=$(find "$PROJECT_DIR/build/libs" -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No se generó ningún JAR"
            exit 1
          fi

          echo "JAR encontrado: $JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Entregar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: ${{ env.JAR }}
          if-no-files-found: error
