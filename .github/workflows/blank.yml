name: GalloGiro 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUSCANDO PROYECTO NEOFORGE"
          echo "========================================"

          BUILD_FILE=$(find . -type f | grep -E '/build\.gradle(\.kts)?$' | head -n 1 || true)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No se encontró build.gradle."
            echo ""
            echo "Buscando archivos del proyecto..."
            find . -maxdepth 6 -type f | grep -v '/.git/' | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Build encontrado:"
          echo "$BUILD_FILE"

          echo "Carpeta del proyecto:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar proyecto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "PROYECTO ENCONTRADO"
          echo "========================================"

          pwd

          echo ""
          echo "Archivos:"
          ls -la

          echo ""
          echo "Build:"
          ls -l build.gradle build.gradle.kts 2>/dev/null || true

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            echo "Usando Gradle Wrapper"
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "No existe gradlew."
            echo "Instalando Gradle..."

            sudo apt-get update
            sudo apt-get install -y gradle

            gradle --version
          fi

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "COMPILANDO GALLOGIRO"
          echo "NEOFORGE 1.21.1"
          echo "========================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean build --no-daemon --stacktrace
          else
            gradle clean build --no-daemon --stacktrace
          fi

      - name: Mostrar JAR generado
        shell: bash
        run: |
          echo "========================================"
          echo "JAR GENERADO"
          echo "========================================"

          if [ -d "$PROJECT_DIR/build/libs" ]; then
            ls -lah "$PROJECT_DIR/build/libs/"
          else
            echo "ERROR: No existe build/libs"
            exit 1
          fi

      - name: Subir JAR a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: "${{ env.PROJECT_DIR }}/build/libs/*.jar"
          if-no-files-found: error
