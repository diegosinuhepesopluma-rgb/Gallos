name: Compilar y generar JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Buscar ZIP del mod
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e

          rm -rf proyecto
          mkdir -p proyecto

          unzip -q "$ZIP_FILE" -d proyecto

          echo "Contenido descomprimido:"
          find proyecto -maxdepth 4 -type f | head -100

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -e

          BUILD_FILE=$(find proyecto -type f -name "build.gradle" \
            -o -type f -name "build.gradle.kts" \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: El ZIP no contiene build.gradle ni build.gradle.kts."
            echo "Archivos encontrados:"
            find proyecto -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "build encontrado en: $BUILD_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "No existe gradlew. Se usará Gradle instalado."
          fi

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Buscar JAR
        shell: bash
        run: |
          set -e

          echo "JAR GENERADO:"
          find "$PROJECT_DIR/build/libs" -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -print

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
