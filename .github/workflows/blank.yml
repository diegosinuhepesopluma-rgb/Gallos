name: Generar JAR NeoForge 1.21.1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle automáticamente
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Buscar proyecto
        shell: bash
        run: |
          echo "Buscando build.gradle..."
          find . -name "build.gradle" -o -name "build.gradle.kts"

      - name: Compilar JAR
        shell: bash
        run: |
          if [ -f "build.gradle" ]; then
            gradle build --no-daemon
          elif [ -f "build.gradle.kts" ]; then
            gradle build --no-daemon
          else
            echo "ERROR: No se encontró build.gradle ni build.gradle.kts"
            exit 1
          fi

      - name: Buscar JAR
        shell: bash
        run: |
          find . -type f -name "*.jar" -print

      - name: Entregar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
