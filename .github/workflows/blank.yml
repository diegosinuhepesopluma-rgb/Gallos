name: Compilar NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUSCANDO PROYECTO GALLOGIRO"
          echo "========================================"

          PROJECT=""

          # Buscar build.gradle en cualquier carpeta,
          # ignorando .git
          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/src/main/java" ] || [ -d "$DIR/src/main/java" ]; then
              PROJECT="$DIR"
              break
            fi

            # Si simplemente contiene build.gradle,
            # también sirve como proyecto
            PROJECT="$DIR"
            break
          done < <(find . -type f -name "build.gradle" -not -path "./.git/*" | sort)

          # Si no encontró build.gradle, buscar build.gradle.kts
          if [ -z "$PROJECT" ];
