name: Build NeoForge Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "Buscando build.gradle..."

          PROJECT_DIR=""

          FILE=$(find . -type f -name "build.gradle" \
            ! -path "./.git/*" \
            -print -quit)

          if [ -n "$FILE" ]; then
            PROJECT_DIR="$(dirname "$FILE")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FILE=$(find . -type f -name "build.gradle.kts" \
              ! -path "./.git/*" \
              -print -quit)

            if [ -n "$FILE" ]; then
              PROJECT_DIR="$(dirname "$FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró build.gradle."
            echo ""
            echo "Arch
