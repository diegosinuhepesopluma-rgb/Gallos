name: GalloGiro JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descomprimir ZIP
        run: |
          mkdir -p proyecto
          unzip -o "$(find . -maxdepth 1 -name '*.zip' | head -1)" -d proyecto

      - name: Encontrar proyecto
        run: |
          BUILD=$(find proyecto -name build.gradle -type f | head -1)

          if [ -z "$BUILD" ]; then
            echo "ERROR: No se encontró build.gradle"
            find proyecto -type f
            exit 1
          fi

          DIR=$(dirname "$BUILD")
          echo "DIR=$DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $DIR"

      - name: Preparar Gradle
        run: |
          cd "$DIR"
          chmod +x gradlew

      - name: Crear JAR
        run: |
          cd "$DIR"
          ./gradlew build --no-daemon

      - name: Entregar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-1.21.1-JAR
          path: ${{ env.DIR }}/build/libs/*.jar
          if-no-files-found: error
