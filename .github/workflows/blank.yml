name: Generar JAR NeoForge 1.21.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: 'none'

      - name: Buscar ZIP del mod
        shell: bash
        run: |
          set -e

          echo "=== BUSCANDO ZIP ==="

          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          rm -rf proyecto
          mkdir proyecto

          unzip -q "$ZIP" -d proyecto

          echo "=== CONTENIDO ==="
          find proyecto -maxdepth 3 -type f | head -100

      - name: Encontrar carpeta del proyecto
        shell: bash
        run: |
          set -e

          echo "=== BUSCANDO build.gradle ==="

          BUILD=$(find proyecto -type f -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)

          if [ -z "$BUILD" ]; then
            echo "ERROR: No se encontró build.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD")

          echo "Proyecto encontrado en: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== PROYECTO ==="
          pwd

          echo "=== ARCH
