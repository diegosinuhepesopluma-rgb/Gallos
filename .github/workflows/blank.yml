name: Build NeoForge Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar y generar JAR
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Buscar y descomprimir ZIP
        shell: bash
        run: |
          set -e

          echo "Buscando archivos ZIP..."

          shopt -s nullglob
          for zipfile in *.zip; do
            echo "Descomprimiendo: $zipfile"
            unzip -o "$zipfile" -d extracted
          done

          if [ -d "extracted" ]; then
            cp -r extracted/. .
          fi

          echo "Archivos encontrados:"
          find . -maxdepth 4 -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            | head -200

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find . \
            -type f \
            -name "build.gradle" \
            -not -path "./.git/*" \
            -not -path "./build/*" \
            -print -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró build.gradle."
            echo "El repositorio debe contener el proyecto NeoForge."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >>
