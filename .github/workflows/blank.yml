name: Compilar y generar JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Buscar proyecto
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "BUSCANDO PROYECTO NEOFORGE"
          echo "================================"

          if [ -f "build.gradle" ]; then
            echo "Proyecto encontrado en la raíz."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          BUILD_FILE=$(find . -type f -name "build.gradle" \
            -not -path "./.git/*" | head -n 1 || true)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No se encontró build.gradle."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y gradle

          echo "Versión de Gradle:"
          gradle --version

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "COMPILANDO GALLOGIRO"
          echo "================================"

          gradle clean build --no-daemon

      - name: Buscar JAR
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "BUSCANDO ARCHIVO JAR"
          echo "================================"

          find "$PROJECT_DIR/build/libs" \
            -type f \
            -name "*.jar" \
            -print

          JAR=$(find "$PROJECT_DIR/build/libs" \
            -type f \
            -name "*.jar" | head -n 1 || true)

          if [ -z "$JAR" ]; then
            echo "ERROR: No se generó ningún JAR."
            exit 1
          fi

          echo "JAR ENCONTRADO:"
          echo "$JAR"

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-
