name: Generar JAR NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "=== BUSCANDO PROYECTO ==="

          PROJECT=""

          if [ -f "./gradlew" ]; then
            PROJECT="."
          else
            PROJECT=$(find . -type f -name "gradlew" -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró gradlew."
            echo "Archivos Gradle encontrados:"
            find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print
            exit 1
          fi

          echo "Proyecto encontrado en: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Dar permisos a Gradle
        shell: bash
        run: |
          set -e
          chmod +x "$PROJECT/gradlew"

      - name: Compilar JAR
        shell: bash
        run: |
          set -e
          cd "$PROJECT"
          ./gradlew build --no-daemon

      - name: Mostrar JAR generado
        shell: bash
        run: |
          set -e
          echo "=== JAR GENERADO ==="
          find "$PROJECT/build/libs" -type f -name "*.jar" -print

      - name: Entregar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: |
            ${{ env.PROJECT }}/build/libs/*.jar
          if-no-files-found: error
