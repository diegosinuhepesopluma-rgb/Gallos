name: Build GalloGiro NeoForge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Buscar y descomprimir ZIP
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "BUSCANDO ZIP DEL PROYECTO"
          echo "================================"

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "No se encontró ningún ZIP."
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -o "$ZIP_FILE" -d project

          echo "ZIP descomprimido correctamente."

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "BUSCANDO PROYECTO GRADLE"
          echo "================================"

          BUILD_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "build.gradle" \
            -not -path "*/build/*" \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE=$(find "$GITHUB_WORKSPACE/project" \
              -type f \
              -name "build.gradle.kts" \
              -not -path "*/build/*" \
              -print -quit)
          fi

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No se encontró build.gradle."
            echo ""
            echo "Archivos encontrados:"
            find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Proyecto NeoForge encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Preparar proyecto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "PREPARANDO PROYECTO"
          echo "================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./
