name: Generar JAR GalloGiro NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Obtener código completo
        uses: actions/checkout@v4

      - name: ☕ Java 21 (actualizado)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          # ❌ QUITAMOS cache:gradle → falla sin archivos Gradle

      - name: 📦 Instalar Gradle 8.14 manualmente
        run: |
          set -e
          apt update && apt install -y wget unzip
          wget -q https://services.gradle.org/distributions/gradle-8.14-bin.zip -P /tmp
          unzip -q /tmp/gradle-8.14-bin.zip -d /opt
          echo "/opt/gradle-8.14/bin" >> $GITHUB_PATH
          gradle --version

      - name: 📋 Ver qué archivos tienes
        run: ls -la && echo "--- src ---" && ls -la src/ 2>/dev/null || true

      # ❌ NO PUEDES COMPILAR SI NO EXISTEN build.gradle Y GRADLE
      - name: ⚠️ Advertencia si falta configuración
        run: |
          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "❌ ERROR CRÍTICO: No existe build.gradle"
            echo "Agrega la estructura completa de NeoForge MDK a tu repositorio"
            exit 1
          fi

      - name: 🔨 Compilar
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle build --no-daemon --stacktrace

      - name: 📂 Extraer JAR
        run: |
          mkdir -p resultado
          JAR=$(find ./build/libs -maxdepth 3 -type f -name "*.jar" \
            ! -name "*sources*" ! -name "*javadoc*" ! -name "*dev*" | head -n 1)
          if [ -z "$JAR" ]; then
            echo "❌ No se generó JAR"
            exit 1
          fi
          cp "$JAR" resultado/

      - name: 📤 Subir
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: resultado/*.jar
          if-no-files-found: error
