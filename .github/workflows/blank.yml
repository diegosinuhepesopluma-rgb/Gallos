name: GalloGiro NeoForge 1.21.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Encontrar proyecto
        id: proyecto
        shell: bash
        run: |
          PROJECT=$(find . -type f -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró build.gradle ni build.gradle.kts"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "Proyecto encontrado en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Dar permisos a Gradle
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Compilar GalloGiro
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew clean build --no-daemon
          else
            gradle clean build --no-daemon
          fi

      - name: Buscar JAR
        run: |
          echo "JAR generados:"
          find . -type f -path "*/build/libs/*.jar" -print

          if ! find . -type f -path "*/build/libs/*.jar" | grep -q .; then
            echo "ERROR: No se generó ningún JAR."
            exit 1
          fi

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: "**/build/libs/*.jar"
          if-no-files-found: error
