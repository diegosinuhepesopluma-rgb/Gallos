name: Build GalloGiro NeoForge

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Buscar y descomprimir ZIP
        shell: bash
        run: |
          set -e

          mkdir -p proyecto

          ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP" -d proyecto

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -e

          if [ -f "proyecto/build.gradle" ]; then
            PROJECT_DIR="proyecto"
          elif [ -f "proyecto/gallo_ready/build.gradle" ]; then
            PROJECT_DIR="proyecto/gallo_ready"
          elif [ -f "proyecto/project/gallo_ready/build.gradle" ]; then
            PROJECT_DIR="proyecto/project/gallo_ready"
          else
            echo "ERROR: No se encontró build.gradle."
            echo "Archivos encontrados:"
            ls -R proyecto
            exit 1
          fi

          echo "Proyecto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Directorio:"
          pwd

          echo "Compilando con Gradle instalado..."

          gradle clean build --no-daemon --stacktrace

      - name: Buscar JAR
        shell: bash
        run: |
          set -e

          mkdir -p salida

          JAR=$(ls "$PROJECT_DIR"/build/libs/*.jar 2>/dev/null \
            | grep -v sources \
            | grep -v javadoc \
            | head -n 1 || true)

          if [ -z "$JAR" ]; then
            echo "ERROR: No se encontró el JAR."
            echo "Contenido de build/libs:"
            ls -la "$PROJECT_DIR/build/libs" || true
            exit 1
          fi

          echo "JAR encontrado:"
