name: Build GalloGiro

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Buscar y descomprimir ZIP
        shell: bash
        run: |
          set -e

          mkdir -p proyecto

          ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No hay ningún ZIP en el repositorio."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP" -d proyecto

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          for dir in \
            "proyecto" \
            "proyecto/gallo_ready" \
            "proyecto/project/gallo_ready"
          do
            if [ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró build.gradle."
            echo ""
            echo "Contenido del ZIP:"
            ls -R proyecto
            exit 1
          fi

          echo "Proyecto NeoForge:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Dar permisos a Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Compilando..."
          echo "Directorio: $(pwd)"

          if [ -f gradlew ]; then
            ./gradlew clean build --no-daemon --stacktrace
          else
            echo "ERROR: No existe gradlew."
            exit 1
          fi

      - name: Buscar JAR
        shell: bash
        run: |
          set -e

          mkdir -p salida

          JAR=$(ls "$PROJECT_DIR"/build/libs/*.jar 2>/dev/null | grep -v sources | grep -v javadoc | head -n 1 || true)

          if [ -z "$JAR" ]; then
            echo "ERROR: No se encontró el JAR."
            ls -la "$PROJECT_DIR/build/libs" || true
            exit 1
          fi

          echo "JAR encontrado:"
          echo "$JAR"

          cp "$JAR" "salida/GalloGiro-NeoForge-1.21.1.jar"

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: salida/GalloGiro-NeoForge-1.21.1.jar
          if-no-files-found: error
