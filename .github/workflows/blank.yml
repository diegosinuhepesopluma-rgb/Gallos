name: Compilar JAR

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Descomprimir proyecto
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          rm -rf proyecto
          mkdir proyecto
          unzip -q "$ZIP" -d proyecto

      - name: Encontrar proyecto NeoForge
        run: |
          set -e
          DIR=$(find "$GITHUB_WORKSPACE/proyecto" -type f -name "build.gradle*" -printf '%h\n' | head -n 1)
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Compilar JAR
        run: |
          set -e
          cd "$DIR"
          gradle clean build --no-daemon

      - name: Entregar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: "${{ env.DIR }}/build/libs/*.jar"
          if-no-files-found: error
