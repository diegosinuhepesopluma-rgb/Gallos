name: Compilar y generar JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Buscar ZIP del proyecto
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún ZIP"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"

          rm -rf project
          mkdir project

          unzip -q "$ZIP_FILE" -d project

          echo "Contenido:"
          find project -maxdepth 3 -type f | head -100

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" -type f -name "build.gradle*" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró build.gradle dentro del ZIP"
            find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f
            exit 1
          fi

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Comprobar proyecto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================="
          echo "PROYECTO GALLO GIRO"
          echo "=============================="

          echo "Directorio:"
          pwd

          echo ""
          echo "Archivos:"
          ls -la

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: No existe build.gradle"
            exit 1
          fi

          echo "Proyecto Gradle encontrado correctamente."

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: No existe gradlew"
            exit 1
          fi

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================="
          echo "COMPILANDO NEFORGE"
          echo "=============================="

          ./gradlew build --no-daemon --stacktrace

      - name: Buscar JAR
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "BUSCANDO JAR"
          echo "=============================="

          JAR_FILE=$(find "$PROJECT_DIR/build/libs" -type f -name "*.jar" ! -name "*-sources.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No se encontró ningún JAR"
            find "$PROJECT_DIR/build" -type f
            exit 1
          fi

          echo "JAR encontrado:"
          echo "$JAR_FILE"

          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: ${{ env.JAR_FILE }}
          if-no-files-found: error
