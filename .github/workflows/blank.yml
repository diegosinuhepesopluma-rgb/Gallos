name: Compilar y generar JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "Buscando proyecto NeoForge..."

          # Si ya existe un proyecto directamente
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Proyecto encontrado en la raíz."
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi

          # Buscar ZIP del proyecto
          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP encontrado: $ZIP_FILE"

            mkdir -p proyecto
            unzip -o "$ZIP_FILE" -d proyecto

            PROJECT_DIR=$(find "$GITHUB_WORKSPACE/proyecto" \
              -type f \
              -name "build.gradle" -o -name "build.gradle.kts" \
              -not -path "*/.git/*" \
              -printf '%h\n' | head -n 1)

            if [ -n "$PROJECT_DIR" ]; then
              echo "Proyecto encontrado en:"
              echo "$PROJECT_DIR"
              echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          echo "ERROR: No se encontró ningún proyecto NeoForge."
          echo "Archivos encontrados:"
          find . -maxdepth 4 -type f | head -200
          exit 1

