name: Construir GalloGiro NeoForge 1.21.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Descomprimir proyecto
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          mkdir -p proyecto
          unzip -o "$ZIP" -d proyecto

      - name: Encontrar proyecto Gradle
        run: |
          PROJECT=$(find proyecto -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró build.gradle ni build.gradle.kts dentro del ZIP."
            echo "Contenido encontrado:"
            find proyecto -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Dar permisos a Gradle
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Compilar GalloGiro
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean build --no-daemon

      - name: Buscar JAR
        run: |
          JAR=$(find "$PROJECT_DIR/build/libs" -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: La compilación terminó pero no se encontró el JAR."
            echo "Contenido de build/libs:"
            find "$PROJECT_DIR/build" -type f | head -100
            exit 1
          fi

          echo "JAR encontrado: $JAR"
          cp "$JAR" ./GalloGiro-NeoForge-1.21.1.jar

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: GalloGiro-NeoForge-1.21.1.jar
          if-no-files-found: error
