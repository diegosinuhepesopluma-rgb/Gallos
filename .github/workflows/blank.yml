name: Build GalloGiro NeoForge 1.21.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -e

          PROJECT=""

          if [ -f "./gradlew" ]; then
            PROJECT="."
          else
            PROJECT=$(find . -type f -name "gradlew" \
              -not -path "./.git/*" \
              -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró gradlew."
            echo "Contenido del repositorio:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Proyecto encontrado en: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Dar permisos a Gradle
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Compilar NeoForge
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean build --no-daemon --stacktrace

      - name: Buscar JAR
        shell: bash
        run: |
          set -e

          echo "JAR encontrados:"
          find "$PROJECT_DIR" -type f -name "*.jar" \
            -not -path "*/.gradle/*"
