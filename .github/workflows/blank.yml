name: GalloGiro 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: 'none'

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "DESCOMPRIMIENDO GALLOGIRO"
          echo "=============================="

          ZIP="GalloGiro_GITHUB_COMPLETO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No existe $ZIP"
            echo "Archivos disponibles:"
            find . -maxdepth 2 -type f
            exit 1
          fi

          rm -rf proyecto_gallogiro

          mkdir -p proyecto_gallogiro

          unzip -q "$ZIP" -d proyecto_gallogiro

          echo "Proyecto descomprimido:"
          find proyecto_gallogiro -maxdepth 3 -type f | head -100

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "BUSCANDO PROYECTO NEOFORGE"
          echo "=============================="

          PROJECT=$(find proyecto_gallogiro -type f -name "build.gradle" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró build.gradle"
            find proyecto_gallogiro -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "build.gradle encontrado:"
          echo "$PROJECT"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB
