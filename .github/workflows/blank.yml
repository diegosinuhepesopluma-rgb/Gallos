name: Generar JAR NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar proyecto
        shell: bash
        run: |
          set -e

          echo "=== BUSCANDO PROYECTO GALLOGIRO ==="

          # Si hay un ZIP del proyecto, descomprimirlo
          for ZIP in *.zip; do
            if [ -f "$ZIP" ]; then
              echo "Descomprimiendo: $ZIP"
              mkdir -p proyecto
              unzip -o "$ZIP" -d proyecto
            fi
          done

          # Buscar build.gradle
          BUILD=$(find . -type f -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)

          if [ -z "$BUILD" ]; then
            echo "ERROR: No se encontró build.gradle."
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD")

         
