name: Compilar GalloGiro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12.1"
          cache-disabled: true

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          FILE=$(find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print -quit)

          if [ -n "$FILE" ]; then
            PROJECT_DIR="$(dirname "$FILE")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró build.gradle."
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "Proyecto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Comprobar proyecto
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "=============================="
          echo "GALLOGIRO NEFORGE 1.21.1"
          echo "=============================="

          ls -la

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: No existe build.gradle."
            exit 1
          fi

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "=============================="
          echo "COMPILANDO"
          echo "=============================="

          gradle clean build --no-daemon --stacktrace

      - name: Buscar JAR
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/dist"

          FOUND=0

          while IFS= read -r -d '' JAR; do
            echo "JAR encontrado: $JAR"
            cp "$JAR" "$GITHUB_WORKSPACE/dist/"
            FOUND=1
          done < <(
            find "$PROJECT_DIR/build/libs" \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              ! -name "*-sources.jar" \
              ! -name "*-javadoc.jar" \
              -print0
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: No se generó ningún JAR."
            ls -la "$PROJECT_DIR/build/libs" || true
            exit 1
          fi

      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1-JAR
          path: dist/*.jar
          if-no-files-found: error
