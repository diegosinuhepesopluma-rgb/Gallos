name: GalloGiro JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar JAR
        run: |
          if [ ! -f "./Diego" ]; then
            echo "ERROR: No se encontró el archivo Diego"
            exit 1
          fi

          cp "./Diego" "./GalloGiro_REPO_COMPLETO_CORREGIDO.jar"

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: "./GalloGiro_REPO_COMPLETO_CORREGIDO.jar"
          if-no-files-found: error
