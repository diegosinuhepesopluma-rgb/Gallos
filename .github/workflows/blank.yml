name: GalloGiro - Generar JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Generar JAR NeoForge 1.21.1
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Preparar proyecto
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PREPARANDO GALLOGIRO"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/_project"

          ZIP_FILE=""

          for f in "$GITHUB_WORKSPACE"/*.zip; do
            if [ -f "$f" ]; then
              ZIP_FILE="$f"
              break
            fi
          done

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP encontrado:"
            echo "$ZIP_FILE"

            unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_project"
          fi

          PROJECT_DIR=""

          while IFS= read -r build_file; do
            PROJECT_DIR="$(dirname "$build_file")"
            break
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "build.gradle" \
              -not -path "*/.git/*" \
              -not -path "*/build/*" \
              -not -path "*/_project/_project/*"
          )

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r build_file; do
              PROJECT_DIR="$(dirname "$build_file")"
              break
