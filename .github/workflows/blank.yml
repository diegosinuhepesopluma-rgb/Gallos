name: GalloGiro 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DESCOMPRIMIENDO GALLOGIRO"
          echo "======================================"

          ZIP_FILE="GalloGiro_GITHUB_COMPLETO.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No existe $ZIP_FILE"
            echo "Archivos disponibles:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          rm -
