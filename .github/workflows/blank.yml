name: Compilar GalloGiro NeoForge 1.21.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12.1"

      - name: Compilar GalloGiro
        working-directory: gallo_ready
        run: |
          gradle clean build --no-daemon --stacktrace

      - name: Buscar JAR
        run: |
          echo "JAR encontrados:"
          find gallo_ready/build/libs -type f -name "*.jar" -print
          test -n "$(find gallo_ready/build/libs -type f -name "*.jar" -print -quit)"

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: gallo_ready/build/libs/*.jar
          if-no-files-found: error
