name: Compilar JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          GRADLEW=$(find . -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontró gradlew"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Proyecto encontrado en: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Contenido del proyecto:"
          ls -la

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar JAR
       
