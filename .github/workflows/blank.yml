name: Compilar y generar JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Buscar ZIP del proyecto
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "BUSCANDO ZIP DEL PROYECTO"
          echo "=============================="

          ZIP_FILE=$(find . -type f -name "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún ZIP."
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_FILE"

         
