name: Generar JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Buscar ZIP del mod
        shell: bash
        run: |
          set -e

          echo "=== BUSCANDO ZIP ==="

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          rm -rf proyecto
          mkdir proyecto

          unzip -o "$ZIP" -d proyecto

          echo "=== CONTENIDO ==="
          find proyecto -maxdepth 3 -type f | head -100

      - name: Encontrar carpeta del proyecto
        shell: bash
        run: |
          set -e

          echo "=== BUSCANDO build.gradle ==="

          BUILD=$(find proyecto -type f -name "build.gradle" -print -quit)

          if [ -z "$BUILD" ]; then
            echo "ERROR: No se encontró build.gradle"
            find proyecto -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD")

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar JAR NeoForge 1.21.1
        shell: bash
        run: |
          set -e

          echo "=== COMPILANDO GALLOGIRO ==="
          echo "Directorio: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle build --no-daemon --stacktrace

      - name: Buscar JAR generado
        shell: bash
        run: |
          set -e

          echo "=== JAR GENERADO ==="

          find "$PROJECT_DIR/build/libs" -type f -name "*.jar" -print

          if ! find "$PROJECT_DIR/build/libs" -type f -name "*.jar" | grep -q .; then
            echo "ERROR: No se generó ningún JAR"
            exit 1
          fi

      - name: Entregar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
