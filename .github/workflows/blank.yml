name: Build NeoForge Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "Buscando build.gradle..."

          PROJECT_DIR=$(find . -type f -name "build.gradle" -o -name "build.gradle.kts" -not -path "*/build/*" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró build.gradle ni build.gradle.kts."
            echo "Archivos del repositorio:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Directorio:"
          pwd

          echo "Contenido:"
          ls -la

          echo "Versión de Java:"
          java -version

          echo "Versión de Gradle:"
          gradle --version

          echo "Compilando mod..."

          gradle clean build --no-daemon --stacktrace

      -
