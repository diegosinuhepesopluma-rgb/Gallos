name: Compilar y generar JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "Buscando proyecto..."

          if [ -f "./build.gradle" ]; then
            PROJECT_DIR="."
          elif [ -f "./gallo_ready/build.gradle" ]; then
            PROJECT_DIR="./gallo_ready"
          else
            PROJECT_DIR=$(find . -type f -name "build.gradle" -not -path "./.git/*" | head -n 1 | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró build.gradle"
            find . -maxdepth 4 -type f | sort
            exit 
