name: Compilar GalloGiro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir ZIP
        run: |
          set -e
          mkdir -p proyecto
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "ZIP: $ZIP"
          unzip -o "$ZIP" -d proyecto

      - name: Encontrar proyecto
        run: |
          PROJECT=$(find proyecto -name "build.gradle" -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró build.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyecto: $PROJECT"

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Compilar NeoForge
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean build --no-daemon --stacktrace

      - name: Buscar JAR
        run: |
          JAR=$(find "$PROJECT_DIR/build/libs" -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No se encontró el JAR"
            exit 1
          fi

          echo "JAR encontrado: $JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: ${{ env.JAR }}
          if-no-files-found: error
