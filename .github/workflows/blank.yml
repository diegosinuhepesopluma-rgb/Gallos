name: Compilar GalloGiro NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: GalloGiro 1.21.1
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar proyecto
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " BUSCANDO GALLOGIRO"
          echo "======================================"

          rm -rf proyecto

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -n "$ZIP" ]; then
            echo "ZIP encontrado: $ZIP"
            mkdir -p proyecto
            unzip -q "$ZIP" -d proyecto
          else
            echo "No hay ZIP. Buscando build.gradle..."
            mkdir -p proyecto
            cp -r . proyecto/original
          fi

          BUILD=$(find proyecto -type f -name "build.gradle" | head -n 1)

          if [ -z "$BUILD" ]; then
            echo "ERROR: No se encontró build.gradle."
            echo ""
            echo "Contenido del repositorio:"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD")

          echo "build.gradle encontrado:"
          echo "$BUILD"

          echo "Proyecto:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12.1"

      - name: Verificar proyecto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " PROYECTO ENCONTRADO"
          echo "======================================"

          pwd
          echo ""

          ls -la

          test -f build.gradle

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo " COMPILANDO GALLOGIRO"
          echo " NEOFORGE 1.21.1"
          echo "======================================"

          gradle clean build --no-daemon --stacktrace

      - name: Buscar JAR
        shell: bash
        run: |
          set -e

          JAR=$(find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No se generó el JAR."
            find "$PROJECT_DIR/build" -type f | sort
            exit 1
          fi

          echo "======================================"
          echo " JAR GENERADO"
          echo "======================================"

          ls -lh "$JAR"

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
