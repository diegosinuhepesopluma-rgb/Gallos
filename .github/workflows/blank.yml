name: Compilar NeoForge y generar JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar NeoForge
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Verificar proyecto
        shell: bash
        run: |
          set -e

          echo "=== GALLOGIRO NEOFORGE 1.21.1 ==="

          if [ ! -f build.gradle ]; then
            echo "ERROR: falta build.gradle en la raíz."
            exit 1
          fi

          if [ ! -f settings.gradle ]; then
            echo "ERROR: falta settings.gradle en la raíz."
            exit 1
          fi

          if [ ! -d src ]; then
            echo "ERROR: falta la carpeta src/"
            exit 1
          fi

          echo "build.gradle: OK"
          echo "settings.gradle: OK"
          echo "src/: OK"

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e
          gradle clean build --no-daemon --stacktrace

      - name: Comprobar JAR
        shell: bash
        run: |
          set -e

          echo "=== JAR GENERADO ==="

          find build/libs -maxdepth 1 -type f -name "*.jar" -print

          COUNT=$(find build/libs -maxdepth 1 -type f -name "*.jar" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: no se generó ningún JAR."
            exit 1
          fi

          echo "JAR encontrado correctamente."

      - name:
