name: Compilar y generar JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Comprobar proyecto
        run: |
          echo "=== PROYECTO ==="
          pwd
          echo "=== ARCHIVOS ==="
          ls -la
          echo "=== BUILD.GRADLE ==="
          test -f build.gradle
          echo "build.gradle encontrado correctamente"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar NeoForge
        run: |
          echo "=== COMPILANDO GALLO GIRO ==="
          gradle build --no-daemon --stacktrace
          echo "=== COMPILACION TERMINADA ==="

      - name: Buscar JAR
        run: |
          echo "=== JAR GENERADO ==="
          find build/libs -type f -name "*.jar" -print
          
          JAR=$(find build/libs -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No se genero ningun JAR"
            exit 1
          fi

          echo "JAR encontrado: $JAR"
          mkdir -p release
          cp "$JAR" release/GalloGiro-NeoForge-1.21.1.jar

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: release/GalloGiro-NeoForge-1.21.1.jar
          if-no-files-found: error
