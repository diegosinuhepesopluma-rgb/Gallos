name: Compilar y generar JAR GalloGiro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar NeoForge
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12.1"

      - name: Verificar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " VERIFICANDO GALLOGIRO NEOFORGE 1.21.1"
          echo "======================================"

          echo "Directorio actual:"
          pwd

          echo ""
          echo "Archivos principales:"
          ls -la

          if [ ! -f "build.gradle" ]; then
            echo "ERROR: No se encontró build.gradle en la raíz."
            exit 1
          fi

          if [ ! -f "settings.gradle" ]; then
            echo "ERROR: No se encontró settings.gradle en la raíz."
            exit 1
          fi

          if [ ! -d "src" ]; then
            echo "ERROR: No se encontró la carpeta src."
            exit 1
          fi

          echo ""
          echo "Proyecto NeoForge encontrado correctamente."

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " COMPILANDO GALLOGIRO"
          echo " Minecraft 1.21.1"
          echo " NeoForge"
          echo " Java 21"
          echo "======================================"

          gradle clean build --no-daemon --stacktrace

      - name: Mostrar JAR generado
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " JAR GENERADOS"
          echo "======================================"

          if [ ! -d "build/libs" ]; then
            echo "ERROR: No existe build/libs."
            exit 1
          fi

          find build/libs -maxdepth 1 -type f -name "*.jar" -print

          JAR_COUNT=$(find build/libs -maxdepth 1 -type f -name "*.jar" | wc -l)

          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "ERROR: No se generó ningún JAR."
            exit 1
          fi

          echo ""
          echo "Se encontró $JAR_COUNT JAR."

      - name: Subir JAR a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
