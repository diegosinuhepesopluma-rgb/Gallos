name: Compilar GalloGiro NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12.1"

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -e
          PROJECT=""

          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            PROJECT="."
          else
            ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1 || true)

            if [ -n "$ZIP" ]; then
              echo "Descomprimiendo $ZIP..."
              rm -rf _project
              mkdir -p _project
              unzip -q "$ZIP" -d _project
            fi

            PROJECT=$(find . -type f -name 'build.gradle' -o -name 'build.gradle.kts' -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró build.gradle ni build.gradle.kts."
            exit 1
          fi

          PROJECT=$(realpath "$PROJECT")
          echo "Proyecto encontrado en: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Compilar JAR
        shell: bash
        run: |
          set -e
          cd "$PROJECT"
          gradle clean build --no-daemon --stacktrace

      - name: Mostrar JAR generado
        shell: bash
        run: |
          find "$PROJECT/build/libs" -maxdepth 1 -type f -name '*.jar' -print
          test -n "$(find "$PROJECT/build/libs" -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Entregar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: ${{ env.PROJECT }}/build/libs/*.jar
         
