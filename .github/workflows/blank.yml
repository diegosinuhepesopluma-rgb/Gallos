name: Generar JAR GalloGiro NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Buscar archivos del mod
        shell: bash
        run: |
          echo "=== ARCHIVOS DEL REPOSITORIO ==="
          find . -maxdepth 6 -type f | sort

      - name: Buscar código Java
        shell: bash
        run: |
          echo "=== JAVA ==="
          find . -type f -name "*.java" -print

      - name: Preparar proyecto NeoForge
        shell: bash
        run: |
          set -e

          PROJECT="$(find . -type f -name "*.java" -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró código Java."
            exit 1
          fi

          SRC_DIR="$(dirname "$(dirname "$(dirname "$PROJECT")")")"

          echo "Código encontrado:"
          echo "$PROJECT"

          echo "Carpeta:"
          echo "$SRC_DIR"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Comprobar Gradle
        run: |
          gradle --version

      - name: Compilar
        shell: bash
        run: |
          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "ERROR: El proyecto no tiene build.gradle."
            echo "No se puede compilar el mod solamente con archivos Java."
            echo "Necesitas el proyecto NeoForge/MDK completo."
            exit 1
          fi

          gradle build --no-daemon

      - name: Buscar JAR
        shell: bash
        run: |
          mkdir -p dist

          find . -type f -path "*/build/libs/*.jar" -exec cp {} dist/ \;

          echo "=== JAR GENERADO ==="
          ls -lh dist/

      - name: Entregar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: dist/*.jar
          if-no-files-found: error
