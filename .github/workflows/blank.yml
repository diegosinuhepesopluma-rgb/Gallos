name: Compilar y generar JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Buscar y preparar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "BUSCANDO PROYECTO NEFORGE"
          echo "=============================="

          echo "Archivos encontrados:"
          find . -maxdepth 4 -type f | head -200

          # Buscar ZIP del proyecto
          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP encontrado: $ZIP_FILE"

            mkdir -p proyecto_extraido
            unzip -o "$ZIP_FILE" -d proyecto_extraido
          fi

          # Buscar build.gradle o build.gradle.kts
          BUILD_FILE=$(find . \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No se encontró build.gradle."
            echo "Contenido del repositorio:"
            find . -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "================================"
          echo "PROYECTO ENCONTRADO:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Carpeta del proyecto:"
          pwd

          echo "Contenido:"
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: No se encontró gradlew."
            exit 1
          fi

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "=============================="
          echo "COMPILANDO NEFORGE 1.21.1"
          echo "=============================="

          ./gradlew clean build --no-daemon --stacktrace

      - name: Buscar JAR
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "BUSCANDO JAR"
          echo "=============================="

          find "$PROJECT_DIR/build/libs" \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            -print

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
