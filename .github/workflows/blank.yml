name: Compilar JAR

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descomprimir ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No se encontró ningún ZIP"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p proyecto
          unzip -o "$ZIP" -d proyecto

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -e

          DIR=$(find "$GITHUB_WORKSPACE/proyecto" \
            -type f -name "build.gradle" \
            -not -path "*/build/*"
