name: Compilar y generar JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "Buscando proyecto NeoForge..."

          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name '*.zip' -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No se encontró build.gradle ni un ZIP del proyecto."
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print
              exit 1
            fi

            echo "ZIP encontrado: $ZIP_FILE"

            rm -rf "$GITHUB_WORKSPACE/project"
            mkdir -p "$GITHUB_WORKSPACE/project"

            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

            PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" \
              -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
              -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: El ZIP no contiene build.gradle ni build.gradle.kts."
              find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f -print
              exit 1
            fi
          fi

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Comprobar proyecto
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "=============================="
          echo "PROYECTO GALLO GIRO"
          echo "=============================="

          pwd

          echo "Archivos principales:"
          ls -la

          test -f build.gradle || test -f build.gradle.kts

          echo "build.gradle encontrado correctamente."

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "=============================="
          echo "COMPILANDO NEFORGE 1.21.1"
          echo "=============================="

          gradle clean build --no-daemon --stacktrace

      - name: Buscar JAR
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          JAR_FILE=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -print -quit)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No se encontró ningún JAR."
            find build -type f -name '*.jar' -print || true
            exit 1
          fi

          echo "JAR generado: $JAR_FILE"
          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: ${{ env.JAR_FILE }}
          if-no-files-found: error
