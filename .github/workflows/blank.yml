name: Compilar y generar JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUSCANDO PROYECTO GALLO GIRO"
          echo "========================================"

          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . -type f \
              -name "build.gradle" -o -name "build.gradle.kts" \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            FILE="$(find . -type f \
              -name "build.gradle" -o -name "build.gradle.kts" \
              -print -quit)"

            if [ -n "$FILE" ]; then
              PROJECT_DIR="$(dirname "$FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró un proyecto Gradle."
            echo ""
            echo "Archivos encontrados:"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "Proyecto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar Gradle
        shell:
