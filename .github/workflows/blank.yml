name: Crear JAR GalloGiro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Buscar y descomprimir ZIP
        shell: bash
        run: |
          set -e
          echo "Buscando ZIP..."

          ZIP=$(find . -type f -name "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No se encontró ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p proyecto
          unzip -o "$ZIP" -d proyecto

          echo "ZIP descomprimido."

      -
