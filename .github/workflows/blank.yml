name: Compilar GalloGiro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p proyecto
          unzip -o "$ZIP" -d proyecto

          echo "Contenido:"
          find proyecto -maxdepth 4 -type f | head -100

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -e

          PROJECT=$(find proyecto -type f -name "gradlew" \
            -not -path "*/.gradle/*" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró gradlew dentro del ZIP."
            echo "Archivos encontrados:"
            find proyecto -type f | head -200
            exit 1
          fi

          echo "Proyecto NeoForge: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Dar permisos a Gradle
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Compilar NeoForge
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean build --no-daemon --stacktrace

      - name: Buscar JAR
        shell: bash
        run: |
          set -e

          JAR=$(find "$PROJECT_DIR/build/libs" -type f -name "*.jar" \
            -not -name "*-sources.jar" \
            -not -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No se encontró el JAR."
            find "$PROJECT_DIR" -type f -name "*.jar"
            exit 1
          fi

          echo "JAR encontrado: $JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: ${{ env.JAR }}
          if-no-files-found: error
