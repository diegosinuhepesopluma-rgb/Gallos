package com.diegomarcelo.gallogiro.entity;

import com.diegomarcelo.gallogiro.registry.ModSounds;
import net.minecraft.sounds.SoundEvent;
import net.minecraft.world.damagesource.DamageSource;
import net.minecraft.world.entity.EntityType;
import net.minecraft.world.entity.LivingEntity;
import net.minecraft.world.entity.PathfinderMob;
import net.minecraft.world.entity.ai.attributes.AttributeSupplier;
import net.minecraft.world.entity.ai.attributes.Attributes;
import net.minecraft.world.entity.ai.goal.FloatGoal;
import net.minecraft.world.entity.ai.goal.Goal;
import net.minecraft.world.entity.ai.goal.LookAtPlayerGoal;
import net.minecraft.world.entity.ai.goal.MeleeAttackGoal;
import net.minecraft.world.entity.ai.goal.RandomLookAroundGoal;
import net.minecraft.world.entity.ai.goal.RandomStrollGoal;
import net.minecraft.world.entity.player.Player;
import net.minecraft.world.level.Level;

import java.util.Comparator;
import java.util.EnumSet;

import org.jetbrains.annotations.Nullable;

import software.bernie.geckolib.animatable.GeoEntity;
import software.bernie.geckolib.animatable.instance.AnimatableInstanceCache;
import software.bernie.geckolib.animation.AnimatableManager;
import software.bernie.geckolib.animation.AnimationController;
import software.bernie.geckolib.animation.PlayState;
import software.bernie.geckolib.animation.RawAnimation;
import software.bernie.geckolib.util.GeckoLibUtil;

public class GalloEntity extends PathfinderMob implements GeoEntity {

    private static final RawAnimation ANIM_COMER =
            RawAnimation.begin().thenPlay("animation.gallo.comer");

    private static final RawAnimation ANIM_PELEA =
            RawAnimation.begin().thenPlay("animation.gallo.pelea_patada");

    private final AnimatableInstanceCache cache =
            GeckoLibUtil.createInstanceCache(this);

    private boolean attackingAnimation = false;

    public GalloEntity(EntityType<? extends PathfinderMob> type, Level level) {
        super(type, level);
        this.xpReward = 3;
    }

    public static AttributeSupplier.Builder createAttributes() {
        return PathfinderMob.createMobAttributes()
                .add(Attributes.MAX_HEALTH, 10.0D)
                .add(Attributes.MOVEMENT_SPEED, 0.28D)
                .add(Attributes.ATTACK_DAMAGE, 2.0D)
                .add(Attributes.FOLLOW_RANGE, 16.0D)
                .add(Attributes.KNOCKBACK_RESISTANCE, 0.1D);
    }

    @Override
    protected void registerGoals() {

        this.goalSelector.addGoal(0, new FloatGoal(this));

        // Buscar otro gallo y pelear automáticamente
        this.goalSelector.addGoal(1, new GalloTargetGoal(this));

        // Ataque cuerpo a cuerpo
        this.goalSelector.addGoal(2, new MeleeAttackGoal(this, 1.15D, true) {

            @Override
            protected void checkAndPerformAttack(
                    LivingEntity target,
                    double distanceSq) {

                double reach = this.getAttackReachSqr(target);

                if (distanceSq <= reach
                        && this.getTicksUntilNextAttack() <= 0) {

                    GalloEntity.this.attackingAnimation = true;

                    GalloEntity.this.triggerAnim(
                            "combat",
                            "kick"
                    );

                    super.checkAndPerformAttack(target, distanceSq);
                }
            }
        });

        this.goalSelector.addGoal(
                7,
                new RandomStrollGoal(this, 0.8D)
        );

        this.goalSelector.addGoal(
                8,
                new LookAtPlayerGoal(
                        this,
                        Player.class,
                        8.0F
                )
        );

        this.goalSelector.addGoal(
                9,
                new RandomLookAroundGoal(this)
        );
    }

    /**
     * Hace que un gallo busque al gallo más cercano
     * y empiece a pelear automáticamente.
     */
    private static final class GalloTargetGoal extends Goal {

        private final GalloEntity gallo;

        private GalloEntity target;

        private GalloTargetGoal(GalloEntity gallo) {
            this.gallo = gallo;

            this.setFlags(
                    EnumSet.of(Flag.TARGET)
            );
        }

        @Override
        public boolean canUse() {

            if (gallo.getTarget() != null
                    && gallo.getTarget().isAlive()) {
                return false;
            }

            target = gallo.level().getEntitiesOfClass(
                    GalloEntity.class,
                    gallo.getBoundingBox().inflate(16.0D),
                    other ->
                            other != gallo
                            && other.isAlive()
            )
            .stream()
            .min(
                    Comparator.comparingDouble(
                            gallo::distanceToSqr
                    )
            )
            .orElse(null);

            return target != null;
        }

        @Override
        public boolean canContinueToUse() {

            return gallo.getTarget() instanceof GalloEntity target
                    && target.isAlive()
                    && gallo.distanceToSqr(target)
                    <= 20.0D * 20.0D;
        }

        @Override
        public void start() {
            gallo.setTarget(target);
        }

        @Override
        public void stop() {

            if (gallo.getTarget() instanceof GalloEntity) {
                gallo.setTarget(null);
            }

            target = null;
        }
    }

    /**
     * Animaciones GeckoLib.
     */
    @Override
    public void registerControllers(
            AnimatableManager.ControllerRegistrar controllers) {

        controllers.add(
                new AnimationController<>(
                        this,
                        "main",
                        5,
                        state -> {

                            if (this.attackingAnimation) {

                                state.setAndContinue(
                                        ANIM_PELEA
                                );

                                this.attackingAnimation = false;

                            } else if (this.isCrouching()) {

                                state.setAndContinue(
                                        ANIM_COMER
                                );

                            } else {

                                state.getController()
                                        .setAnimation(
                                                RawAnimation.begin()
                                                        .thenLoop(
                                                                "animation.gallo.idle"
                                                        )
                                        );
                            }

                            return PlayState.CONTINUE;
                        }
                )
        );

        controllers.add(
                new AnimationController<>(
                        this,
                        "combat",
                        0,
                        state -> PlayState.STOP
                )
                .triggerableAnim(
                        "kick",
                        ANIM_PELEA
                )
        );
    }

    @Override
    protected @Nullable SoundEvent getAmbientSound() {
        return ModSounds.KIKIRIKI.get();
    }

    @Override
    protected int getAmbientSoundInterval() {
        return 20 * 20;
    }

    @Override
    protected SoundEvent getHurtSound(
            DamageSource source) {

        return ModSounds.KIKIRIKI.get();
    }

    @Override
    protected SoundEvent getDeathSound() {
        return ModSounds.KIKIRIKI.get();
    }

    /**
     * Caché de animaciones GeckoLib.
     */
    @Override
    public AnimatableInstanceCache getAnimatableInstanceCache() {
        return cache;
    }

    @Override
    public void triggerAnim(
            String controllerName,
            String animName) {

        GeoEntity.super.triggerAnim(
                controllerName,
                animName
        );
    }
}
