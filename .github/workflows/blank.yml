name: Compilar y generar JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            PROJECT_DIR=$(find "$GITHUB_WORKSPACE" \
              -type f -name "build.gradle" -o -name "build.gradle.kts" \
              -not -path "*/.git/*" \
              -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró build.gradle ni build.gradle.kts"
            find "$GITHUB_WORKSPACE" -maxdepth
