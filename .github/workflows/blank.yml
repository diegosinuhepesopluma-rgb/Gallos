name: Compilar y generar JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compilar NeoForge
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Buscar y extraer proyecto
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "BUSCANDO PROYECTO"
          echo "=============================="

          ZIP_FILE=$(find . \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP encontrado: $ZIP_FILE"

            mkdir -p project_extract
            unzip -q "$ZIP_FILE" -d project_extract

            echo "ZIP extraído."
          else
            echo "No se encontró ZIP."
            echo "Se utilizará directamente el repositorio."
          fi

      - name: Encontrar proyecto NeoForge
        shell: bash
        run: |
          set -
