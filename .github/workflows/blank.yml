name: Compilar NeoForge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar NeoForge
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "   PREPARANDO PROYECTO GALLOGIRO"
          echo "================================="

          mkdir -p proyecto

          # Buscar ZIP del proyecto
          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1 || true)

          if [ -n "$ZIP" ]; then
            echo "ZIP encontrado:"
            echo "$ZIP"

            unzip -o "$ZIP" -d proyecto
          fi

          # Buscar build.gradle
          BUILD=$(find . -type f -name "build.gradle" \
            -not -path "./.git/*" | head -n 1 || true)

          if [ -z "$BUILD" ]; then
            echo ""
            echo "ERROR: No se encontró build.gradle."
            echo ""
            echo "Archivos encontrados:"
            find . -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD")

          echo ""
          echo "Proyecto NeoForge encontrado en:"
          echo "$PROJECT_DIR"
          echo ""

          cd "$PROJECT_DIR"

          echo "Contenido del proyecto:"
          ls -la

          if [ ! -f build.gradle ]; then
            echo "ERROR: build.gradle no existe."
            exit 1
          fi

          if [ ! -d src ]; then
            echo "ERROR: no existe la carpeta src."
            exit 1
          fi

          echo ""
          echo "Proyecto preparado correctamente."

      - name: Compilar NeoForge
        shell: bash
        run: |
          set -e

          BUILD=$(find . -type f -name "build.gradle" \
            -not -path "./.git/*" | head -n 1)

          PROJECT_DIR=$(dirname "$BUILD")

          cd "$PROJECT_DIR"

          echo "Compilando desde:"
          pwd

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean build --no-daemon --stacktrace
          else
            gradle clean build --no-daemon --stacktrace
          fi

      - name: Comprobar JAR
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "       JAR GENERADO"
          echo "================================="

          find . -type f -path "*/build/libs/*.jar" -print

          JAR=$(find . -type f -path "*/build/libs/*.jar" | head -n 1 || true)

          if [ -z "$JAR" ]; then
            echo "ERROR: No se generó ningún JAR."
            exit 1
          fi

          echo ""
          echo "JAR encontrado:"
          echo "$JAR"

      - name: Subir JAR a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1-JAR
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
