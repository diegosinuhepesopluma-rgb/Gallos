name: Compilar y generar JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            if [ -f "$dir/settings.gradle" ] || [ -f "$dir/settings.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find . -maxdepth 6 \( -name build.gradle -o -name build.gradle.kts \) -print0)

          if [ -z "$PROJECT_DIR" ]; then
            first="$(find . -maxdepth 6 \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
            [ -n "$first" ] && PROJECT_DIR="$(dirname "$first")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró build.gradle."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Preparar y compilar NeoForge
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          echo "COMPILANDO GALLOGIRO"
          gradle --version
          gradle --no-daemon clean build

      - name: Buscar JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          found=0
          while IFS= read -r -d '' jar; do
            echo "JAR encontrado: $jar"
            cp "$jar" "$GITHUB_WORKSPACE/dist/"
            found=1
          done < <(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' -print0 2>/dev/null || true)

          if [ "$found" -eq 0 ]; then
            echo "ERROR: No se generó ningún JAR."
            ls -la "$PROJECT_DIR/build/libs" 2>/dev/null || true
            exit 1
          fi

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1-JAR
          path: dist/*.jar
          if-no-files-found: error
