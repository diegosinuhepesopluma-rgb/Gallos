name: Build NeoForge Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Buscar y descomprimir ZIP
        shell: bash
        run: |
          set -e

          echo "Buscando ZIP del proyecto..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" -print -quit || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP encontrado: $ZIP_FILE"
            mkdir -p project
            unzip -o "$ZIP_FILE" -d project
          else
            echo "No hay ZIP. Usando el repositorio directamente."
          fi

      - name: Buscar proyecto NeoForge
        shell: bash
        run: |
          set -e

          echo "Buscando build.gradle..."

          PROJECT_DIR=$(find . \
            -type f \
            -name "build.gradle" \
            -not -path "./.git/*" \
            -not -path "./build/*" \
            -print \
            -quit \
          )

         
