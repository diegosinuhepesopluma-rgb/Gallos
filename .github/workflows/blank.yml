name: Compilar GalloGiro NeoForge 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Generar JAR
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Verificar proyecto
        shell: bash
        run: |
          set -e
          echo "=== PROYECTO GALLOGIRO ==="
          pwd
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -d src/main/java
          test -d src/main/resources
          echo "Proyecto encontrado correctamente en la raíz."

      - name: Compilar JAR NeoForge 1.21.1
        shell: bash
        run: |
          set -e
          gradle clean build --no-daemon --stacktrace

      - name: Verificar JAR
        shell: bash
        run: |
          set -e
          echo "=== JAR GENERADO ==="
          find build/libs -maxdepth 1 -type f -name "*.jar" -print
          test -n "$(find build/libs -maxdepth 1 -type f -name "*.jar" -print -quit)"

      - name: Entregar JAR
        uses: actions/upload-artifact@v4
        with:
          name: GalloGiro-NeoForge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
